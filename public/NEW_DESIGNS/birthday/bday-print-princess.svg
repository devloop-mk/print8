<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Quicksand:wght@500;700&amp;display=swap');
      .text-pink { fill: #DB2777; }
      .text-purple { fill: #7E22CE; }
      .text-gold { fill: #B45309; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-princess.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-pink" font-family="'Dancing Script', cursive" font-weight="700" font-size="120">Once upon a time...</text>
    
    <text x="750" y="750" class="text-purple" font-family="'Quicksand', sans-serif" font-weight="700" font-size="40" letter-spacing="4">YOU ARE INVITED TO A MAGICAL CELEBRATION</text>
    
    <text x="750" y="950" class="text-pink" font-family="'Quicksand', sans-serif" font-weight="700" font-size="90" letter-spacing="2">PRINCESS MIA</text>
    <text x="750" y="1050" class="text-gold" font-family="'Dancing Script', cursive" font-weight="700" font-size="90">is turning 6!</text>
    
    <text x="750" y="1250" class="text-purple" font-family="'Quicksand', sans-serif" font-weight="700" font-size="45">SUNDAY, AUGUST 22ND</text>
    <text x="750" y="1320" class="text-purple" font-family="'Quicksand', sans-serif" font-weight="500" font-size="35">FROM 1:00 PM TO 4:00 PM</text>
    
    <text x="750" y="1500" class="text-pink" font-family="'Quicksand', sans-serif" font-weight="700" font-size="40">THE ROYAL CASTLE</text>
    <text x="750" y="1560" class="text-purple" font-family="'Quicksand', sans-serif" font-weight="500" font-size="30">456 FAIRYTALE DRIVE, WONDERLAND</text>
    
    <text x="750" y="1750" class="text-gold" font-family="'Quicksand', sans-serif" font-weight="700" font-size="30">PLEASE RSVP TO THE QUEEN</text>
    <text x="750" y="1810" class="text-purple" font-family="'Quicksand', sans-serif" font-weight="500" font-size="30">555-987-6543</text>
  </g>
</svg>