<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Montserrat:wght@500;700&amp;display=swap');
      .text-teal { fill: #0D9488; }
      .text-purple { fill: #7E22CE; }
      .text-white { fill: #FFFFFF; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-mermaid.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-purple" font-family="'Dancing Script', cursive" font-weight="700" font-size="140">Let's Shell-ebrate!</text>
    
    <text x="750" y="750" class="text-teal" font-family="'Montserrat', sans-serif" font-weight="700" font-size="35" letter-spacing="4">JOIN US UNDER THE SEA FOR</text>
    
    <text x="750" y="950" class="text-white" font-family="'Montserrat', sans-serif" font-weight="700" font-size="80" letter-spacing="6">CHLOE'S</text>
    <text x="750" y="1050" class="text-purple" font-family="'Dancing Script', cursive" font-weight="700" font-size="90">4th Birthday</text>
    
    <text x="750" y="1250" class="text-teal" font-family="'Montserrat', sans-serif" font-weight="700" font-size="40">SATURDAY, AUGUST 8TH</text>
    <text x="750" y="1320" class="text-teal" font-family="'Montserrat', sans-serif" font-weight="500" font-size="30">2:00 PM TO 5:00 PM</text>
    
    <text x="750" y="1500" class="text-purple" font-family="'Montserrat', sans-serif" font-weight="700" font-size="35">MERMAID COVE POOL</text>
    <text x="750" y="1560" class="text-teal" font-family="'Montserrat', sans-serif" font-weight="500" font-size="25">789 OCEAN BREEZE WAY, MIAMI</text>
    
    <text x="750" y="1750" class="text-white" font-family="'Montserrat', sans-serif" font-weight="700" font-size="25" letter-spacing="2">PLEASE RSVP TO THE MER-MOM</text>
    <text x="750" y="1810" class="text-teal" font-family="'Montserrat', sans-serif" font-weight="500" font-size="25">555-444-3333</text>
  </g>
</svg>