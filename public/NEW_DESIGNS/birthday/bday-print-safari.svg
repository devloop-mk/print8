<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Quicksand:wght@600;700&amp;display=swap');
      .text-green { fill: #15803D; }
      .text-orange { fill: #EA580C; }
      .text-brown { fill: #451A03; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-safari.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-green" font-family="'Fredoka One', cursive" font-size="150" letter-spacing="6">WILD ONE!</text>
    
    <text x="750" y="750" class="text-brown" font-family="'Quicksand', sans-serif" font-weight="700" font-size="40" letter-spacing="2">SWING ON BY FOR A SAFARI ADVENTURE</text>
    
    <text x="750" y="950" class="text-orange" font-family="'Fredoka One', cursive" font-size="90">NOAH IS TURNING 1</text>
    
    <path d="M 650 1050 Q 750 1020 850 1050" fill="none" stroke="#15803D" stroke-width="6" stroke-linecap="round"/>
    
    <text x="750" y="1200" class="text-brown" font-family="'Quicksand', sans-serif" font-weight="700" font-size="45">SUNDAY, JUNE 15TH</text>
    <text x="750" y="1270" class="text-brown" font-family="'Quicksand', sans-serif" font-weight="600" font-size="35">11:00 AM TO 2:00 PM</text>
    
    <text x="750" y="1450" class="text-green" font-family="'Quicksand', sans-serif" font-weight="700" font-size="40">THE JUNGLE RESERVE</text>
    <text x="750" y="1510" class="text-brown" font-family="'Quicksand', sans-serif" font-weight="600" font-size="30">456 SAFARI TRAIL, SAN DIEGO</text>
    
    <text x="750" y="1700" class="text-orange" font-family="'Quicksand', sans-serif" font-weight="700" font-size="30">RSVP TO THE TOUR GUIDE</text>
    <text x="750" y="1760" class="text-brown" font-family="'Quicksand', sans-serif" font-weight="600" font-size="30">555-123-4567</text>
  </g>
