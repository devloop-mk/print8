<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Righteous&amp;family=Montserrat:wght@400;700;900&amp;display=swap');
      .text-cyan { fill: #06B6D4; }
      .text-pink { fill: #EC4899; }
      .text-white { fill: #FFFFFF; }
      .glow-pink { text-shadow: 0 0 10px #EC4899, 0 0 20px #EC4899; }
      .glow-cyan { text-shadow: 0 0 10px #06B6D4, 0 0 20px #06B6D4; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-retro.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-cyan glow-cyan" font-family="'Righteous', cursive" font-size="140" letter-spacing="10">LEVEL UP!</text>
    
    <text x="750" y="750" class="text-white" font-family="'Montserrat', sans-serif" font-weight="700" font-size="35" letter-spacing="6">YOU ARE INVITED TO CELEBRATE</text>
    
    <text x="750" y="950" class="text-pink glow-pink" font-family="'Righteous', cursive" font-size="110">MATT'S 13TH</text>
    <text x="750" y="1050" class="text-white" font-family="'Righteous', cursive" font-size="110">BIRTHDAY</text>
    
    <rect x="550" y="1150" width="400" height="4" fill="#06B6D4" />
    
    <text x="750" y="1300" class="text-cyan" font-family="'Montserrat', sans-serif" font-weight="900" font-size="45" letter-spacing="4">SATURDAY, NOV 14TH</text>
    <text x="750" y="1370" class="text-white" font-family="'Montserrat', sans-serif" font-weight="700" font-size="35" letter-spacing="2">6:00 PM TO 10:00 PM</text>
    
    <text x="750" y="1550" class="text-pink" font-family="'Montserrat', sans-serif" font-weight="900" font-size="40" letter-spacing="4">ARCADE MANIA</text>
    <text x="750" y="1610" class="text-white" font-family="'Montserrat', sans-serif" font-weight="400" font-size="30" letter-spacing="2">123 RETRO BLVD, NEON CITY</text>
    
    <text x="750" y="1800" class="text-cyan" font-family="'Montserrat', sans-serif" font-weight="900" font-size="30" letter-spacing="2">INSERT COIN TO RSVP</text>
    <text x="750" y="1860" class="text-white" font-family="'Montserrat', sans-serif" font-weight="700" font-size="30">555-ARCADE-1</text>
  </g>
</svg>