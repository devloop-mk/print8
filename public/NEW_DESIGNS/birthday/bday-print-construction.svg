<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Paytone+One&amp;family=Open+Sans:wght@600;800&amp;display=swap');
      .text-yellow { fill: #EAB308; }
      .text-black { fill: #1C1917; }
      .text-orange { fill: #EA580C; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-construction.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-black" font-family="'Paytone One', sans-serif" font-size="160" letter-spacing="6">CAUTION!</text>
    
    <text x="750" y="750" class="text-orange" font-family="'Open Sans', sans-serif" font-weight="800" font-size="45" letter-spacing="2">PARTY ZONE AHEAD</text>
    
    <text x="750" y="950" class="text-black" font-family="'Paytone One', sans-serif" font-size="90">MASON IS TURNING 3</text>
    
    <rect x="550" y="1050" width="400" height="12" fill="#1C1917" />
    <rect x="550" y="1050" width="100" height="12" fill="#EAB308" />
    <rect x="700" y="1050" width="100" height="12" fill="#EAB308" />
    <rect x="850" y="1050" width="100" height="12" fill="#EAB308" />
    
    <text x="750" y="1250" class="text-black" font-family="'Open Sans', sans-serif" font-weight="800" font-size="45">SUNDAY, SEPTEMBER 20TH</text>
    <text x="750" y="1320" class="text-black" font-family="'Open Sans', sans-serif" font-weight="600" font-size="35">10:00 AM TO 1:00 PM</text>
    
    <text x="750" y="1500" class="text-orange" font-family="'Open Sans', sans-serif" font-weight="800" font-size="40">THE CONSTRUCTION SITE</text>
    <text x="750" y="1560" class="text-black" font-family="'Open Sans', sans-serif" font-weight="600" font-size="30">321 BUILDER BLVD, AUSTIN</text>
    
    <text x="750" y="1750" class="text-black" font-family="'Open Sans', sans-serif" font-weight="800" font-size="30">REPORT TO FOREMAN (RSVP)</text>
    <text x="750" y="1810" class="text-black" font-family="'Open Sans', sans-serif" font-weight="600" font-size="30">555-777-8888</text>
  </g>
</svg>