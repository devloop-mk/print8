<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Montserrat:wght@300;400;600&amp;display=swap');
      .text-gold { fill: #D4AF37; }
      .text-white { fill: #FFFFFF; }
      .text-gray { fill: #9CA3AF; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-champagne.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-gold" font-family="'Playfair Display', serif" font-style="italic" font-size="120">Pop the Bubbly!</text>
    
    <text x="750" y="750" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="300" font-size="24" letter-spacing="8">JOIN US FOR DINNER AND DRINKS</text>
    <text x="750" y="800" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="300" font-size="24" letter-spacing="8">TO CELEBRATE</text>
    
    <text x="750" y="1000" class="text-white" font-family="'Montserrat', sans-serif" font-weight="600" font-size="70" letter-spacing="12">EMMA'S 25TH</text>
    
    <line x1="650" y1="1150" x2="850" y2="1150" stroke="#D4AF37" stroke-width="1" />
    
    <text x="750" y="1300" class="text-white" font-family="'Playfair Display', serif" font-weight="600" font-size="45" letter-spacing="4">FRIDAY, DECEMBER 5TH</text>
    <text x="750" y="1370" class="text-gold" font-family="'Montserrat', sans-serif" font-weight="400" font-size="26" letter-spacing="4">EIGHT O'CLOCK IN THE EVENING</text>
    
    <text x="750" y="1550" class="text-white" font-family="'Montserrat', sans-serif" font-weight="600" font-size="35" letter-spacing="6">THE VELVET LOUNGE</text>
    <text x="750" y="1610" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="300" font-size="24" letter-spacing="2">321 CHAMPAGNE TERRACE, NY</text>
    
    <text x="750" y="1800" class="text-gold" font-family="'Playfair Display', serif" font-style="italic" font-size="30">Kindly RSVP by November 25th</text>
  </g>
</svg>