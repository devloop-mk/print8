<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Lato:wght@300;400&amp;display=swap');
      .text-rose { fill: #B76E79; }
      .text-dark { fill: #2D3748; }
      .text-gray { fill: #4A5568; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/bday-bg-rosegold.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <text x="750" y="550" class="text-rose" font-family="'Great Vibes', cursive" font-size="140">Fabulous at Fifty</text>
    
    <text x="750" y="750" class="text-gray" font-family="'Lato', sans-serif" font-weight="300" font-size="22" letter-spacing="6">PLEASE JOIN US FOR A DINNER PARTY</text>
    <text x="750" y="800" class="text-gray" font-family="'Lato', sans-serif" font-weight="300" font-size="22" letter-spacing="6">CELEBRATING THE 50TH BIRTHDAY OF</text>
    
    <text x="750" y="1000" class="text-dark" font-family="'Playfair Display', serif" font-weight="600" font-size="90" letter-spacing="4">SARAH JENKINS</text>
    
    <line x1="600" y1="1150" x2="900" y2="1150" stroke="#B76E79" stroke-width="2" />
    
    <text x="750" y="1300" class="text-dark" font-family="'Playfair Display', serif" font-weight="400" font-size="40" letter-spacing="2">SATURDAY, SEPTEMBER 12TH</text>
    <text x="750" y="1370" class="text-gray" font-family="'Lato', sans-serif" font-weight="400" font-size="26" letter-spacing="2">COCKTAILS AT 6:00 PM | DINNER AT 7:30 PM</text>
    
    <text x="750" y="1550" class="text-dark" font-family="'Playfair Display', serif" font-weight="600" font-size="35" letter-spacing="2">THE ROSEWOOD RESTAURANT</text>
    <text x="750" y="1610" class="text-gray" font-family="'Lato', sans-serif" font-weight="300" font-size="24" letter-spacing="2">321 ELEGANCE BOULEVARD</text>
    
    <text x="750" y="1800" class="text-rose" font-family="'Playfair Display', serif" font-style="italic" font-size="30">Kindly RSVP by September 1st</text>
  </g>
</svg>