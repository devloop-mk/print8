<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@400;600&amp;family=Montserrat:wght@300;400;500&amp;family=Tangerine:wght@400;700&amp;display=swap');
      .text-terra { fill: #B3543E; }
      .text-brown { fill: #4A3B32; }
      .text-tan { fill: #8C7A6B; }
    </style>
  </defs>
  
  <!-- Background Image -->
  <image href="/NEW_DESIGNS/backgrounds/wedding-bg-terracotta.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Editable Text Overlay -->
  <g text-anchor="middle">
    <text x="750" y="480" class="text-tan" font-family="'Montserrat', sans-serif" font-weight="400" font-size="20" letter-spacing="8">WE INVITE YOU TO CELEBRATE</text>
    <text x="750" y="520" class="text-tan" font-family="'Montserrat', sans-serif" font-weight="400" font-size="20" letter-spacing="8">THE MARRIAGE OF</text>
    
    <!-- Names -->
    <text x="750" y="750" class="text-terra" font-family="'Tangerine', cursive" font-weight="700" font-size="190">Amelia</text>
    <text x="750" y="880" class="text-brown" font-family="'Cormorant Upright', serif" font-size="50">&amp;</text>
    <text x="750" y="1050" class="text-terra" font-family="'Tangerine', cursive" font-weight="700" font-size="190">Jackson</text>
    
    <!-- Date -->
    <text x="750" y="1250" class="text-brown" font-family="'Cormorant Upright', serif" font-weight="600" font-size="45" letter-spacing="4">SATURDAY, MAY 16TH, 2026</text>
    <text x="750" y="1320" class="text-tan" font-family="'Montserrat', sans-serif" font-weight="300" font-size="22" letter-spacing="4">AT FIVE O'CLOCK IN THE AFTERNOON</text>
    
    <!-- Details -->
    <text x="750" y="1500" class="text-brown" font-family="'Montserrat', sans-serif" font-weight="500" font-size="28" letter-spacing="6">THE DESERT OASIS RETREAT</text>
    <text x="750" y="1550" class="text-tan" font-family="'Montserrat', sans-serif" font-weight="300" font-size="22" letter-spacing="2">789 CANYON ROAD</text>
    <text x="750" y="1600" class="text-tan" font-family="'Montserrat', sans-serif" font-weight="300" font-size="22" letter-spacing="2">PALM SPRINGS, CALIFORNIA</text>
    
    <text x="750" y="1780" class="text-terra" font-family="'Cormorant Upright', serif" font-weight="600" font-size="32" letter-spacing="2">DINNER &amp; DANCING TO FOLLOW</text>
