<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cinzel:wght@400;600;700&amp;family=Montserrat:wght@300;400&amp;display=swap');
      .text-dark { fill: #4A5D4E; } /* Olive/Forest Green */
      .text-light { fill: #6B705C; }
    </style>
  </defs>
  
  <!-- Background Image -->
  <image href="/NEW_DESIGNS/backgrounds/wedding-bg-watercolor.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Editable Text Overlay -->
  <g text-anchor="middle">
    <text x="750" y="450" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="4">CELEBRATE WITH US AS WE</text>
    <text x="750" y="490" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="4">TIE THE KNOT</text>
    
    <!-- Names -->
    <text x="750" y="700" class="text-dark" font-family="'Great Vibes', cursive" font-size="160">Kyaraine &amp;</text>
    <text x="750" y="880" class="text-dark" font-family="'Great Vibes', cursive" font-size="160">Orhan</text>
    
    <text x="750" y="1050" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="4">YOUR COMPANY IS AWAITED</text>
    <text x="750" y="1090" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="4">AT OUR MARRIAGE</text>
    
    <!-- Date -->
    <text x="750" y="1250" class="text-dark" font-family="'Cinzel', serif" font-weight="700" font-size="55" letter-spacing="6">20  |  AUGUST  |  2026</text>
    
    <!-- Details -->
    <text x="750" y="1350" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="2">At 4 o'clock in the afternoon</text>
    
    <text x="750" y="1430" class="text-dark" font-family="'Cinzel', serif" font-weight="600" font-size="32" letter-spacing="4">Loui Garden</text>
    <text x="750" y="1480" class="text-light" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="2">123 Anywhere St., Any City</text>
  </g>
</svg>