<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@300;400;600&amp;family=Playfair+Display&amp;display=swap');
    </style>
    <linearGradient id="blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFC0CB" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>
  <rect width="1500" height="2100" fill="#FAFAFA"/>
  <rect width="1500" height="2100" fill="url(#blush)"/>
  
  <!-- Soft Watercolor-like blobs -->
  <circle cx="200" cy="200" r="400" fill="#FFB6C1" opacity="0.2" filter="url(#blur)"/>
  <circle cx="1300" cy="1800" r="500" fill="#E6E6FA" opacity="0.3" filter="url(#blur)"/>
  
  <g text-anchor="middle" fill="#4A4A4A">
    <text x="750" y="400" font-family="'Montserrat', sans-serif" font-weight="300" font-size="20" letter-spacing="8">PLEASE JOIN US FOR THE WEDDING OF</text>
    
    <text x="750" y="700" font-family="'Great Vibes', cursive" font-size="180" fill="#B76E79">Olivia</text>
    <text x="750" y="880" font-family="'Montserrat', sans-serif" font-weight="300" font-size="30" letter-spacing="10">AND</text>
    <text x="750" y="1100" font-family="'Great Vibes', cursive" font-size="180" fill="#B76E79">Benjamin</text>
    
    <text x="750" y="1350" font-family="'Playfair Display', serif" font-size="40" letter-spacing="4">SUNDAY, SEPTEMBER 6TH, 2026</text>
    <text x="750" y="1420" font-family="'Playfair Display', serif" font-size="28" letter-spacing="2">HALF PAST FOUR IN THE AFTERNOON</text>
    
    <text x="750" y="1650" font-family="'Montserrat', sans-serif" font-weight="600" font-size="28" letter-spacing="4">THE ROSE GARDEN</text>
    <text x="750" y="1720" font-family="'Montserrat', sans-serif" font-weight="300" font-size="20" letter-spacing="2">101 ROMANCE BLVD, AUSTIN, TX</text>
  </g>
</svg>