<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&amp;family=Cormorant+Garamond:wght@400;600&amp;family=Lato:wght@300;400&amp;display=swap');
      .text-burgundy { fill: #5C1A1B; }
      .text-charcoal { fill: #2D2D2D; }
      .text-warm-grey { fill: #71717A; }
    </style>
  </defs>
  
  <!-- Background Image -->
  <image href="/NEW_DESIGNS/backgrounds/wedding-bg-autumn.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Editable Text Overlay -->
  <g text-anchor="middle">
    <text x="750" y="500" class="text-warm-grey" font-family="'Lato', sans-serif" font-weight="300" font-size="20" letter-spacing="6">TOGETHER WITH THEIR FAMILIES</text>
    
    <!-- Names -->
    <text x="750" y="720" class="text-burgundy" font-family="'Dancing Script', cursive" font-size="160">Charlotte</text>
    <text x="750" y="850" class="text-charcoal" font-family="'Cormorant Garamond', serif" font-size="50" font-style="italic">and</text>
    <text x="750" y="1030" class="text-burgundy" font-family="'Dancing Script', cursive" font-size="160">Matthew</text>
    
    <text x="750" y="1200" class="text-charcoal" font-family="'Cormorant Garamond', serif" font-weight="400" font-size="32" letter-spacing="2">REQUEST THE PLEASURE OF YOUR COMPANY</text>
    <text x="750" y="1250" class="text-charcoal" font-family="'Cormorant Garamond', serif" font-weight="400" font-size="32" letter-spacing="2">AT THEIR WEDDING CELEBRATION</text>
    
    <!-- Date -->
    <text x="750" y="1400" class="text-burgundy" font-family="'Cormorant Garamond', serif" font-weight="600" font-size="45" letter-spacing="4">SUNDAY, OCTOBER 18TH, 2026</text>
    <text x="750" y="1460" class="text-warm-grey" font-family="'Lato', sans-serif" font-weight="400" font-size="20" letter-spacing="4">AT FOUR THIRTY IN THE AFTERNOON</text>
    
    <!-- Details -->
    <text x="750" y="1600" class="text-charcoal" font-family="'Cormorant Garamond', serif" font-weight="600" font-size="36" letter-spacing="2">THE RUSTIC BARN ESTATE</text>
    <text x="750" y="1650" class="text-warm-grey" font-family="'Lato', sans-serif" font-weight="300" font-size="22" letter-spacing="2">555 HARVEST LANE</text>
    <text x="750" y="1700" class="text-warm-grey" font-family="'Lato', sans-serif" font-weight="300" font-size="22" letter-spacing="2">NASHVILLE, TENNESSEE</text>
    
    <text x="750" y="1850" class="text-burgundy" font-family="'Dancing Script', cursive" font-size="50">Dinner and dancing to follow</text>
  </g>
</svg>