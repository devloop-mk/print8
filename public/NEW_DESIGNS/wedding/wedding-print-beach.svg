<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Montserrat:wght@300;400&amp;family=Cormorant+Garamond:ital,wght@0,400;1,400&amp;display=swap');
      .text-charcoal { fill: #333333; }
      .text-gray { fill: #555555; }
    </style>
  </defs>
  
  <!-- Background Image -->
  <image href="/NEW_DESIGNS/backgrounds/wedding-bg-beach.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Semi-transparent overlay to ensure text readability if the image is too bright -->
  <rect x="250" y="350" width="1000" height="1400" fill="#FFFFFF" opacity="0.4" rx="20" />
  
  <!-- Editable Text Overlay -->
  <g text-anchor="middle">
    <text x="750" y="500" class="text-charcoal" font-family="'Montserrat', sans-serif" font-weight="400" font-size="24" letter-spacing="4">PLEASE JOIN US TO</text>
    <text x="750" y="540" class="text-charcoal" font-family="'Montserrat', sans-serif" font-weight="400" font-size="24" letter-spacing="4">CELEBRATE THE MARRIAGE OF</text>
    
    <!-- Names -->
    <text x="750" y="750" class="text-charcoal" font-family="'Alex Brush', cursive" font-size="140">Ashley Smith</text>
    <text x="750" y="880" class="text-gray" font-family="'Cormorant Garamond', serif" font-size="40">&amp;</text>
    <text x="750" y="1030" class="text-charcoal" font-family="'Alex Brush', cursive" font-size="140">Michael James</text>
    
    <!-- Date -->
    <text x="750" y="1200" class="text-charcoal" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="50" letter-spacing="2">Saturday October 24, 2026</text>
    <text x="750" y="1260" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="4">AT SIX THIRTY IN THE EVENING</text>
    
    <!-- Details -->
    <text x="750" y="1400" class="text-charcoal" font-family="'Montserrat', sans-serif" font-weight="400" font-size="26" letter-spacing="4">THE BEACH HOUSE RESTAURANT</text>
    <text x="750" y="1450" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="400" font-size="24" letter-spacing="2">3802 BEACH HOUSE LANE</text>
    <text x="750" y="1500" class="text-gray" font-family="'Montserrat', sans-serif" font-weight="400" font-size="24" letter-spacing="2">BEACHSIDE, FLORIDA</text>
    
    <text x="750" y="1650" class="text-charcoal" font-family="'Alex Brush', cursive" font-size="70">Reception to follow</text>
  </g>
</svg>