<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Montserrat:wght@300;400;600;700&amp;family=Marck+Script&amp;display=swap');
    </style>
    <pattern id="tile-border" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#1D4ED8"/>
      <rect x="4" y="4" width="36" height="36" fill="#3B82F6" rx="2"/>
      <rect x="40" y="4" width="36" height="36" fill="#FACC15" rx="2"/>
      <rect x="4" y="40" width="36" height="36" fill="#FDE68A" rx="2"/>
      <rect x="40" y="40" width="36" height="36" fill="#60A5FA" rx="2"/>
      <circle cx="22" cy="22" r="8" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="58" cy="58" r="8" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5E6A8"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="2100" fill="url(#tile-border)"/>
  <rect x="70" y="70" width="1360" height="1960" fill="#F8FAFC"/>
  <polygon points="750,200 1180,520 1180,1580 750,1900 320,1580 320,520" fill="#FFFFFF" stroke="url(#gold-frame)" stroke-width="4"/>

  <!-- Lemons top right -->
  <g transform="translate(1020, 380)">
    <ellipse cx="70" cy="55" rx="48" ry="38" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <ellipse cx="70" cy="55" rx="38" ry="30" fill="#FDE047" opacity="0.5"/>
    <path d="M70,20 Q85,5 95,18" fill="none" stroke="#65A30D" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="130" cy="90" rx="35" ry="28" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <ellipse cx="130" cy="90" rx="18" ry="14" fill="#FEF9C3" opacity="0.8"/>
    <ellipse cx="40" cy="100" rx="22" ry="10" fill="#84CC16" transform="rotate(-25 40 100)"/>
    <ellipse cx="110" cy="30" rx="18" ry="8" fill="#84CC16" transform="rotate(20 110 30)"/>
  </g>

  <!-- Lemons bottom left -->
  <g transform="translate(340, 1480)">
    <ellipse cx="55" cy="45" rx="42" ry="34" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <ellipse cx="100" cy="75" rx="32" ry="26" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <ellipse cx="30" cy="80" rx="20" ry="9" fill="#84CC16" transform="rotate(-30 30 80)"/>
    <ellipse cx="90" cy="25" rx="16" ry="7" fill="#84CC16" transform="rotate(15 90 25)"/>
  </g>

  <g fill="#1E3A5F">
    <text x="750" y="620" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="15" letter-spacing="1.5" textLength="820" lengthAdjust="spacingAndGlyphs">WITH GREAT HONOR WE INVITE YOU TO OUR WEDDING</text>
    <text x="750" y="820" text-anchor="middle" font-family="'Marck Script', cursive" font-size="110" textLength="900" lengthAdjust="spacingAndGlyphs">Natasha &amp; Stefan</text>
    <text x="750" y="980" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="600" font-size="44" letter-spacing="4">30 JULY 2026</text>
    <text x="750" y="1180" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="22" letter-spacing="3" textLength="760" lengthAdjust="spacingAndGlyphs">HOTEL DREAM - STRUGA</text>
    <text x="750" y="1260" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="20" letter-spacing="2" textLength="680" lengthAdjust="spacingAndGlyphs">RECEPTION: 19:00 - 19:30</text>
    <text x="440" y="1660" text-anchor="start" font-family="'Montserrat', sans-serif" font-weight="600" font-size="16" letter-spacing="2" textLength="240" lengthAdjust="spacingAndGlyphs">MITEV FAMILY</text>
    <text x="1060" y="1660" text-anchor="end" font-family="'Montserrat', sans-serif" font-weight="600" font-size="16" letter-spacing="2" textLength="240" lengthAdjust="spacingAndGlyphs">PETROV FAMILY</text>
  </g>
</svg>
