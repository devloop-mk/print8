<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Italianno&amp;family=Raleway:wght@300;400&amp;display=swap');
      .text-navy { fill: #1E293B; }
      .text-slate { fill: #475569; }
      .text-blue { fill: #3B82F6; }
    </style>
  </defs>
  
  <!-- Background Image -->
  <image href="/NEW_DESIGNS/backgrounds/wedding-bg-winter.png" width="1500" height="2100" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Editable Text Overlay -->
  <g text-anchor="middle">
    <text x="750" y="450" class="text-slate" font-family="'Raleway', sans-serif" font-weight="300" font-size="20" letter-spacing="8">WITH GREAT JOY</text>
    <text x="750" y="490" class="text-slate" font-family="'Raleway', sans-serif" font-weight="300" font-size="20" letter-spacing="8">WE INVITE YOU TO THE WEDDING OF</text>
    
    <!-- Names -->
    <text x="750" y="750" class="text-navy" font-family="'Italianno', cursive" font-size="180">Victoria</text>
    <text x="750" y="880" class="text-slate" font-family="'Cinzel', serif" font-size="40">&amp;</text>
    <text x="750" y="1050" class="text-navy" font-family="'Italianno', cursive" font-size="180">Christopher</text>
    
    <!-- Date -->
    <text x="750" y="1250" class="text-navy" font-family="'Cinzel', serif" font-weight="600" font-size="40" letter-spacing="6">DECEMBER 12, 2026</text>
    <text x="750" y="1320" class="text-slate" font-family="'Raleway', sans-serif" font-weight="400" font-size="22" letter-spacing="4">AT FOUR O'CLOCK IN THE AFTERNOON</text>
    
    <!-- Details -->
    <text x="750" y="1500" class="text-navy" font-family="'Cinzel', serif" font-weight="500" font-size="32" letter-spacing="4">THE SNOW PINE LODGE</text>
    <text x="750" y="1550" class="text-slate" font-family="'Raleway', sans-serif" font-weight="300" font-size="22" letter-spacing="2">100 MOUNTAIN PEAK DRIVE</text>
    <text x="750" y="1600" class="text-slate" font-family="'Raleway', sans-serif" font-weight="300" font-size="22" letter-spacing="2">ASPEN, COLORADO</text>
    
    <text x="750" y="1780" class="text-navy" font-family="'Italianno', cursive" font-size="60">Reception to follow</text>
  </g>
</svg>