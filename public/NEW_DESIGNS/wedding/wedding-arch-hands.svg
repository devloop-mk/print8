<svg viewBox="0 0 1500 2100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Montserrat:wght@300;400&amp;family=Marck+Script&amp;display=swap');
    </style>
    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1500" height="2100" fill="#FFFFFF"/>

  <!-- Arch panel -->
  <path d="M 320, 520 A 430,430 0 0,1 1180,520 L 1180, 1780 L 320, 1780 Z" fill="#E9E0D8"/>
  <path d="M 340, 520 A 410,410 0 0,1 1160,520 L 1160, 1760 L 340, 1760 Z" fill="none" stroke="#D6C8BC" stroke-width="2"/>

  <!-- Botanical top -->
  <g transform="translate(750, 480)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="#D1FAE5" filter="url(#soft-blur)"/>
    <path d="M-60,-10 Q-20,-50 20,-15 Q50,-40 70,-5" fill="none" stroke="#6B8F71" stroke-width="3"/>
    <path d="M-40,5 Q0,-30 40,0" fill="none" stroke="#84A98C" stroke-width="2.5"/>
    <circle cx="-35" cy="-18" r="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="-35" cy="-18" r="6" fill="#FDE68A"/>
    <circle cx="15" cy="-22" r="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="15" cy="-22" r="5" fill="#FDE68A"/>
    <circle cx="50" cy="-8" r="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <!-- Hands illustration bottom right -->
  <g transform="translate(980, 1540)" opacity="0.85">
    <path d="M20,120 C40,80 80,70 110,90 C130,100 140,130 120,150 C100,170 60,165 40,140 Z" fill="#F5D0C5" stroke="#E8B4A8" stroke-width="2"/>
    <path d="M110,90 C150,75 190,95 200,130 C210,160 180,185 140,175 C120,170 105,150 110,120 Z" fill="#F0C8BC" stroke="#E8B4A8" stroke-width="2"/>
    <ellipse cx="95" cy="118" rx="10" ry="8" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1.5"/>
    <circle cx="95" cy="118" r="3" fill="#D4D4D8"/>
    <path d="M180,100 L220,60 L235,75 L195,115 Z" fill="#334155"/>
    <path d="M30,140 L5,170 L20,185 L50,155 Z" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <g fill="#3D3229" text-anchor="middle">
    <text x="750" y="680" font-family="'Playfair Display', serif" font-style="italic" font-weight="400" font-size="26">Two hearts, one journey — join us as we begin ours</text>
    <text x="750" y="880" font-family="'Marck Script', cursive" font-size="108">Mia &amp; Martin</text>
    <text x="750" y="1020" font-family="'Montserrat', sans-serif" font-weight="300" font-size="22" letter-spacing="2">We invite you to celebrate with us</text>
    <text x="750" y="1180" font-family="'Playfair Display', serif" font-weight="600" font-size="48">08.09.2026</text>
    <text x="750" y="1320" font-family="'Marck Script', cursive" font-size="56">The Pool</text>
    <text x="750" y="1420" font-family="'Montserrat', sans-serif" font-weight="300" font-size="22">Reception 19:30 - 20:00</text>
    <text x="480" y="1680" text-anchor="start" font-family="'Montserrat', sans-serif" font-weight="400" font-size="20" letter-spacing="1">Arsov Family</text>
    <text x="1020" y="1680" text-anchor="end" font-family="'Montserrat', sans-serif" font-weight="400" font-size="20" letter-spacing="1">Petrovi Family</text>
  </g>
</svg>
