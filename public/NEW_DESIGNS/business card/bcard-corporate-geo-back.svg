<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;">

  <defs>
    <linearGradient id="corp-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="dot-pattern-light" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1050" height="600" fill="url(#corp-gradient)" />
  <rect width="1050" height="600" fill="url(#dot-pattern-light)" />

  <g id="print8-logo-back">
    <rect x="475" y="200" width="100" height="100" rx="15" fill="#FFF" data-print8-logo-hide-with-image="true" />
    <text x="525" y="272" fill="#0284C7" font-size="65" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <text x="525" y="370" fill="#FFF" font-size="48" font-weight="bold" text-anchor="middle">COMPANY</text>
  <text x="525" y="410" fill="#E0F2FE" font-size="20" letter-spacing="4" text-anchor="middle">WWW.COMPANY.COM</text>
</svg>
