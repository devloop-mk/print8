<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Times New Roman', serif;">

  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <pattern id="line-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1F2937" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1050" height="600" fill="#111827" />
  <rect width="1050" height="600" fill="url(#line-pattern)" />

  <rect x="30" y="30" width="990" height="540" fill="none" stroke="url(#gold-gradient)" stroke-width="2" />
  <rect x="40" y="40" width="970" height="520" fill="none" stroke="url(#gold-gradient)" stroke-width="1" opacity="0.5" />

  <g id="print8-logo-back">
    <path d="M525,180 L600,310 L450,310 Z" fill="none" stroke="url(#gold-gradient)" stroke-width="5" data-print8-logo-hide-with-image="true" />
    <path d="M525,210 L570,295 L480,295 Z" fill="url(#gold-gradient)" data-print8-logo-hide-with-image="true" />
  </g>

  <text x="525" y="400" fill="url(#gold-gradient)" font-size="48" font-weight="bold" text-anchor="middle" letter-spacing="8">WRIGHT &amp; CO.</text>
  <text x="525" y="440" fill="#9CA3AF" font-size="16" text-anchor="middle" letter-spacing="4">EST. 1985</text>
</svg>
