  <rect width="1050" height="600" fill="#111827" />
  <rect width="1050" height="600" fill="url(#line-pattern)" />

  <rect x="30" y="30" width="990" height="540" fill="none" stroke="url(#gold-gradient)" stroke-width="2" />
  <rect x="40" y="40" width="970" height="520" fill="none" stroke="url(#gold-gradient)" stroke-width="1" opacity="0.5" />

  <g id="print8-logo-front">
    <path d="M525,60 L555,110 L495,110 Z" fill="none" stroke="url(#gold-gradient)" stroke-width="3" data-print8-logo-hide-with-image="true" />
    <path d="M525,75 L540,105 L510,105 Z" fill="url(#gold-gradient)" data-print8-logo-hide-with-image="true" />
  </g>

  <text x="525" y="240" fill="url(#gold-gradient)" font-size="64" font-weight="bold" text-anchor="middle" letter-spacing="4">ALEXANDER WRIGHT</text>
  <text x="525" y="290" fill="#D1D5DB" font-size="20" text-anchor="middle" letter-spacing="6">MANAGING PARTNER</text>

  <line x1="425" y1="330" x2="625" y2="330" stroke="url(#gold-gradient)" stroke-width="1" />

