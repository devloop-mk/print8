<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">

  <defs>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <symbol id="print8-icon-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></symbol>
    <symbol id="print8-icon-email" viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></symbol>
    <symbol id="print8-icon-web" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm9 9h-2.15a15.3 15.3 0 00-1.07-4.58A8.03 8.03 0 0121 11zM12 4c.9 1.5 1.62 3.26 1.88 5H10.1c.26-1.74.98-3.5 1.88-5z"/></symbol>
    <symbol id="print8-icon-location" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></symbol>
  </defs>

  <rect width="1050" height="600" fill="#0F172A" />
  <path d="M0,600 C300,500 400,200 1050,300 L1050,600 Z" fill="url(#primary-gradient)" opacity="0.8" />
  <path d="M0,600 C400,600 600,400 1050,500 L1050,600 Z" fill="url(#primary-gradient)" opacity="0.5" />

  <g id="print8-logo-front">
    <circle cx="120" cy="120" r="40" fill="url(#primary-gradient)" data-print8-logo-hide-with-image="true" />
    <text x="120" y="135" fill="#FFF" font-size="40" font-weight="bold" text-anchor="middle">L</text>
  </g>
  <text x="180" y="135" fill="#FFF" font-size="36" font-weight="bold">COMPANY</text>

  <text x="120" y="380" fill="#FFF" font-size="48" font-weight="bold">John Doe</text>
  <text x="120" y="420" fill="#9CA3AF" font-size="24" letter-spacing="2">CHIEF EXECUTIVE OFFICER</text>

  <g id="print8-contact-block" transform="translate(580 408)">
    <g transform="translate(0 -66)" color="#E5E7EB">
      <use href="#print8-icon-phone" width="18" height="18" y="2"/>
      <text x="28" y="16" fill="#E5E7EB" font-size="20">+1 (555) 123-4567</text>
    </g>
    <g transform="translate(0 -22)" color="#E5E7EB">
      <use href="#print8-icon-email" width="18" height="18" y="2"/>
      <text x="28" y="16" fill="#E5E7EB" font-size="20">john.doe@company.com</text>
    </g>
    <g transform="translate(0 22)" color="#E5E7EB">
      <use href="#print8-icon-web" width="18" height="18" y="2"/>
      <text x="28" y="16" fill="#E5E7EB" font-size="20">www.company.com</text>
    </g>
    <g transform="translate(0 66)" color="#E5E7EB">
      <use href="#print8-icon-location" width="18" height="18" y="2"/>
      <text x="28" y="16" fill="#E5E7EB" font-size="20">123 Business Rd, Suite 100</text>
    </g>
  </g>
</svg>
