<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;">

  <defs>
    <linearGradient id="corp-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E2E8F0" />
    </pattern>
    <pattern id="dot-pattern-light" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1050" height="600" fill="#FFFFFF" />
  <rect width="1050" height="600" fill="url(#dot-pattern)" />
  
  <polygon points="0,0 450,0 300,600 0,600" fill="url(#corp-gradient)" />
  <polygon points="450,0 480,0 330,600 300,600" fill="#0284C7" opacity="0.3" />
  
  <rect x="80" y="80" width="60" height="60" rx="10" fill="#FFF" />
  <text x="110" y="125" fill="#0284C7" font-size="40" font-weight="bold" text-anchor="middle">C</text>
  <text x="160" y="125" fill="#FFF" font-size="36" font-weight="bold">COMPANY</text>
  
  <text x="500" y="200" fill="#0F172A" font-size="54" font-weight="900">Jane Smith</text>
  <text x="500" y="240" fill="#0284C7" font-size="24" font-weight="bold" letter-spacing="2">MARKETING DIRECTOR</text>
  
  <g transform="translate(500, 350)">
    <circle cx="15" cy="-6" r="15" fill="url(#corp-gradient)" />
    <text x="45" y="0" fill="#475569" font-size="22">+1 (555) 987-6543</text>
    
    <circle cx="15" cy="44" r="15" fill="url(#corp-gradient)" />
    <text x="45" y="50" fill="#475569" font-size="22">jane.smith@company.com</text>
    
    <circle cx="15" cy="94" r="15" fill="url(#corp-gradient)" />
    <text x="45" y="100" fill="#475569" font-size="22">www.company.com</text>
    
    <circle cx="15" cy="144" r="15" fill="url(#corp-gradient)" />
    <text x="45" y="150" fill="#475569" font-size="22">456 Innovation Ave, NY</text>
  </g>
</svg>