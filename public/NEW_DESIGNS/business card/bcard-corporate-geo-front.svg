<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;">

  <defs>
    <linearGradient id="corp-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E2E8F0" />
    </pattern>
    <symbol id="print8-icon-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></symbol>
    <symbol id="print8-icon-email" viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></symbol>
    <symbol id="print8-icon-web" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm9 9h-2.15a15.3 15.3 0 00-1.07-4.58A8.03 8.03 0 0121 11zM12 4c.9 1.5 1.62 3.26 1.88 5H10.1c.26-1.74.98-3.5 1.88-5z"/></symbol>
    <symbol id="print8-icon-location" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></symbol>
  </defs>

  <rect width="1050" height="600" fill="#FFFFFF" />
  <rect width="1050" height="600" fill="url(#dot-pattern)" />

  <polygon points="0,0 450,0 300,600 0,600" fill="url(#corp-gradient)" />
  <polygon points="450,0 480,0 330,600 300,600" fill="#0284C7" opacity="0.3" />

  <g id="print8-logo-front">
    <rect x="80" y="80" width="60" height="60" rx="10" fill="#FFF" data-print8-logo-hide-with-image="true" />
    <text x="110" y="125" fill="#0284C7" font-size="40" font-weight="bold" text-anchor="middle">C</text>
  </g>
  <text x="160" y="125" fill="#FFF" font-size="36" font-weight="bold">COMPANY</text>

  <text x="500" y="200" fill="#0F172A" font-size="54" font-weight="900">Jane Smith</text>
  <text x="500" y="240" fill="#0284C7" font-size="24" font-weight="bold" letter-spacing="2">MARKETING DIRECTOR</text>

  <g transform="translate(500, 350)">
    <g transform="translate(0, -6)">
      <circle cx="15" cy="0" r="15" fill="url(#corp-gradient)" />
      <g transform="translate(6, -7)" color="#FFFFFF"><use href="#print8-icon-phone" width="18" height="18"/></g>
      <text x="45" y="5" fill="#475569" font-size="22">+1 (555) 987-6543</text>
    </g>
    <g transform="translate(0, 44)">
      <circle cx="15" cy="0" r="15" fill="url(#corp-gradient)" />
      <g transform="translate(6, -7)" color="#FFFFFF"><use href="#print8-icon-email" width="18" height="18"/></g>
      <text x="45" y="5" fill="#475569" font-size="22">jane.smith@company.com</text>
    </g>
    <g transform="translate(0, 94)">
      <circle cx="15" cy="0" r="15" fill="url(#corp-gradient)" />
      <g transform="translate(6, -7)" color="#FFFFFF"><use href="#print8-icon-web" width="18" height="18"/></g>
      <text x="45" y="5" fill="#475569" font-size="22">www.company.com</text>
    </g>
    <g transform="translate(0, 144)">
      <circle cx="15" cy="0" r="15" fill="url(#corp-gradient)" />
      <g transform="translate(6, -7)" color="#FFFFFF"><use href="#print8-icon-location" width="18" height="18"/></g>
      <text x="45" y="5" fill="#475569" font-size="22">456 Innovation Ave, NY</text>
    </g>
  </g>
</svg>
