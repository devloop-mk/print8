<svg viewBox="0 0 1600 2400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Montserrat:wght@300;400&amp;display=swap');
      .text-gold { fill: #D4AF37; }
      .text-white { fill: #FFFFFF; }
      .text-light { fill: #9CA3AF; }
    </style>
  </defs>
  <image href="/NEW_DESIGNS/backgrounds/menu-bg-finedining-front.png" width="1600" height="2400" preserveAspectRatio="xMidYMid slice"/>
  
  <g text-anchor="middle">
    <!-- Top Logo Area -->
    <text x="800" y="400" class="text-gold" font-family="'Cinzel', serif" font-weight="700" font-size="120" letter-spacing="12">L'AURA</text>
    <text x="800" y="480" class="text-light" font-family="'Montserrat', sans-serif" font-weight="300" font-size="24" letter-spacing="16">STEAKHOUSE &amp; LOUNGE</text>
    
    <line x1="600" y1="580" x2="1000" y2="580" stroke="#D4AF37" stroke-width="2" />
    
    <!-- Center Title -->
    <text x="800" y="1200" class="text-white" font-family="'Cinzel', serif" font-weight="400" font-size="160" letter-spacing="24">MENU</text>
    
    <!-- Bottom Info -->
    <text x="800" y="1900" class="text-gold" font-family="'Montserrat', sans-serif" font-weight="400" font-size="22" letter-spacing="8">EXECUTIVE CHEF</text>
    <text x="800" y="1950" class="text-white" font-family="'Cinzel', serif" font-weight="600" font-size="35" letter-spacing="4">ALEXANDER WRIGHT</text>
    
    <text x="800" y="2150" class="text-light" font-family="'Montserrat', sans-serif" font-weight="300" font-size="20" letter-spacing="6">EST. 2026</text>
  </g>
</svg>