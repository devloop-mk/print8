<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="cardBar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9f1239" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.5">
    <ellipse cx="100" cy="90" rx="30" ry="18" fill="#fda4af" transform="rotate(-25 100 90)"/>
    <ellipse cx="700" cy="510" rx="30" ry="18" fill="#fda4af" transform="rotate(25 700 510)"/>
    <circle cx="720" cy="100" r="8" fill="#fbbf24"/>
    <circle cx="80" cy="520" r="8" fill="#fbbf24"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="220" y="48" width="360" height="480" rx="6" fill="#fffdfa" stroke="#e7d5c4"/>
    <rect x="240" y="68" width="320" height="440" rx="2" fill="none" stroke="#d4a574" stroke-width="2"/>
    <ellipse cx="400" cy="120" rx="80" ry="18" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.6"/>
    <text x="400" y="168" text-anchor="middle" fill="#9f1239" font-family="Georgia, serif" font-size="12" letter-spacing="4">WEDDING INVITE</text>
    <line x1="300" y1="182" x2="500" y2="182" stroke="#d4a574" stroke-width="1"/>
    <text x="400" y="248" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="36" font-style="italic">Ana &amp; Marko</text>
    <text x="400" y="284" text-anchor="middle" fill="#be123c" font-family="Georgia, serif" font-size="18">&amp;</text>
    <text x="400" y="340" text-anchor="middle" fill="#78716c" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1">15 . 08 . 2026</text>
    <circle cx="270" cy="420" r="20" fill="#fecdd3" opacity="0.5"/>
    <circle cx="530" cy="140" r="16" fill="#fde68a" opacity="0.45"/>
  </g>
  <g filter="url(#soft)" transform="translate(56 200) rotate(-12)">
    <rect width="200" height="120" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="40" height="120" rx="8" fill="url(#cardBar)"/>
    <text x="56" y="52" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Ana Petrova</text>
    <text x="56" y="72" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="9">Marketing Manager</text>
    <text x="56" y="90" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="8">Print 8</text>
  </g>
  <g filter="url(#soft)" transform="translate(544 280) rotate(8)">
    <rect width="120" height="168" rx="4" fill="#fffbeb" stroke="#d6d3d1"/>
    <rect x="8" y="8" width="104" height="152" rx="2" fill="none" stroke="#92400e35" stroke-width="1.5"/>
    <text x="60" y="36" text-anchor="middle" fill="#92400e" font-family="Georgia, serif" font-size="10" font-weight="700" letter-spacing="1">MENU</text>
    <line x1="20" y1="44" x2="100" y2="44" stroke="#92400e" stroke-width="1" opacity="0.4"/>
    <text x="16" y="64" fill="#292524" font-family="Georgia, serif" font-size="8" font-weight="700">Starters</text>
    <rect x="16" y="70" width="88" height="2" fill="#e7e5e4"/>
    <rect x="16" y="78" width="76" height="2" fill="#f5f5f4"/>
    <text x="16" y="98" fill="#292524" font-family="Georgia, serif" font-size="8" font-weight="700">Mains</text>
    <rect x="16" y="104" width="88" height="2" fill="#e7e5e4"/>
    <rect x="16" y="112" width="70" height="2" fill="#f5f5f4"/>
    <text x="16" y="132" fill="#292524" font-family="Georgia, serif" font-size="8" font-weight="700">Desserts</text>
    <rect x="16" y="138" width="88" height="2" fill="#e7e5e4"/>
  </g>
  <g transform="translate(580 88) rotate(6)" opacity="0.92">
    <rect width="120" height="150" rx="8" fill="#fff1f2" stroke="#fecaca"/>
    <ellipse cx="60" cy="36" rx="16" ry="20" fill="#f472b6" opacity="0.85"/>
    <ellipse cx="36" cy="44" rx="12" ry="16" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="84" cy="44" rx="12" ry="16" fill="#fb7185" opacity="0.8"/>
    <text x="60" y="88" text-anchor="middle" fill="#dc2626" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Happy</text>
    <text x="60" y="106" text-anchor="middle" fill="#ea580c" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Birthday!</text>
    <text x="60" y="128" text-anchor="middle" fill="#be123c" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">Petar</text>
