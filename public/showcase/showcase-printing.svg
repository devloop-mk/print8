    <rect x="12" y="12" width="156" height="236" rx="2" fill="none" stroke="#c9a87c" stroke-width="1.5"/>
    <text x="90" y="110" text-anchor="middle" fill="#78350f" font-family="Georgia, serif" font-size="11" letter-spacing="3">INVITATION</text>
    <text x="90" y="148" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="26" font-style="italic">Marko</text>
    <text x="90" y="168" text-anchor="middle" fill="#a16207" font-family="Georgia, serif" font-size="14">&amp;</text>
    <text x="90" y="192" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="26" font-style="italic">Elena</text>
    <circle cx="24" cy="40" r="8" fill="#fda4af" opacity="0.5"/>
    <circle cx="156" cy="220" r="10" fill="#fdba74" opacity="0.45"/>
