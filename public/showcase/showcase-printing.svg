      <text x="76" y="72" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Print 8</text>
      <text x="76" y="100" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="13">Professional Print</text>
      <text x="76" y="124" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="11">info@print8.mk</text>
    </g>
    <g transform="translate(148 188) rotate(-4)">
      <rect width="280" height="168" rx="10" fill="#fff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="56" height="168" rx="10" fill="#0f172a"/>
      <text x="76" y="72" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Ana Petrova</text>
      <text x="76" y="100" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13">Marketing Manager</text>
    </g>
    <g transform="translate(176 176) rotate(6)">
      <rect width="280" height="168" rx="10" fill="#fff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="56" height="168" rx="10" fill="#be123c"/>
      <text x="76" y="72" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Studio Nova</text>
      <text x="76" y="100" fill="#be123c" font-family="Inter, Arial, sans-serif" font-size="13">Design and Branding</text>
