    <rect x="24" y="176" width="135" height="3" rx="1" fill="#f1f5f9"/>
    <text x="24" y="206" fill="#0f172a" font-family="Georgia, serif" font-size="13" font-weight="700">Desserts</text>
    <rect x="24" y="216" width="152" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="24" y="228" width="128" height="3" rx="1" fill="#f1f5f9"/>
