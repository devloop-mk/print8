    <rect y="40" width="200" height="8" fill="#0f172a"/>
    <text x="100" y="32" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="16" letter-spacing="2">MENU</text>
    <text x="24" y="78" fill="#0f172a" font-family="Georgia, serif" font-size="13" font-weight="700">Starters</text>
    <rect x="24" y="88" width="152" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="24" y="100" width="130" height="3" rx="1" fill="#f1f5f9"/>
    <rect x="24" y="112" width="140" height="3" rx="1" fill="#f1f5f9"/>
