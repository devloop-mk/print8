<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" fill="none">
  <defs>
    <path id="kwoArcR" d="M 220 500 A 380 380 0 0 1 980 500"/>
    <clipPath id="sunDiscR"><circle cx="600" cy="760" r="250"/></clipPath>
    <linearGradient id="plateLightR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F8F8"/><stop offset="100%" stop-color="#7A7A7A"/>
    </linearGradient>
    <linearGradient id="plateDarkR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A5A5A"/><stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
    <filter id="grainR" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#grainR)">
    <text fill="#F8F6F2" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="62" font-weight="900" letter-spacing="5" stroke="#3A1010" stroke-width="2.5" paint-order="stroke">
      <textPath href="#kwoArcR" startOffset="50%" text-anchor="middle">KEEP WORKING OUT</textPath>
    </text>
    <g clip-path="url(#sunDiscR)">
      <rect x="350" y="510" width="500" height="52" fill="#6B1D2A"/>
      <rect x="350" y="562" width="500" height="48" fill="#E88D39"/>
      <rect x="350" y="610" width="500" height="44" fill="#F2C14E"/>
      <rect x="350" y="654" width="500" height="42" fill="#3BAFA8"/>
      <rect x="350" y="696" width="500" height="128" fill="#D4C4A8"/>
    </g>
    <circle cx="600" cy="760" r="250" stroke="#F0E6D8" stroke-opacity="0.35" stroke-width="4" fill="none"/>
    <g transform="translate(600 790) rotate(-32)">
      <rect x="-210" y="-10" width="420" height="20" rx="4" fill="url(#plateDarkR)"/>
      <circle cx="-210" cy="0" r="52" fill="url(#plateDarkR)"/>
      <circle cx="-210" cy="0" r="30" fill="url(#plateLightR)"/>
      <circle cx="210" cy="0" r="52" fill="url(#plateDarkR)"/>
      <circle cx="210" cy="0" r="30" fill="url(#plateLightR)"/>
    </g>
  </g>
</svg>
