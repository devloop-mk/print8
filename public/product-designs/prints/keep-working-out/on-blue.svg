<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" fill="none">
  <defs>
    <path id="kwoArcB" d="M 220 500 A 380 380 0 0 1 980 500"/>
    <clipPath id="sunDiscB"><circle cx="600" cy="760" r="250"/></clipPath>
    <linearGradient id="plateLightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F8F8"/><stop offset="100%" stop-color="#7A7A7A"/>
    </linearGradient>
    <linearGradient id="plateDarkB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A5A5A"/><stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
    <filter id="grainB" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#grainB)">
    <text fill="#F8F6F2" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="62" font-weight="900" letter-spacing="5" stroke="#1C1917" stroke-width="3" paint-order="stroke">
      <textPath href="#kwoArcB" startOffset="50%" text-anchor="middle">KEEP WORKING OUT</textPath>
    </text>
    <g clip-path="url(#sunDiscB)">
      <rect x="350" y="510" width="500" height="52" fill="#D4563F"/>
      <rect x="350" y="562" width="500" height="48" fill="#F2A04A"/>
      <rect x="350" y="610" width="500" height="44" fill="#FFD166"/>
      <rect x="350" y="654" width="500" height="42" fill="#5ECFC8"/>
      <rect x="350" y="696" width="500" height="128" fill="#E8D9C0"/>
    </g>
    <circle cx="600" cy="760" r="252" stroke="#F8F6F2" stroke-width="6" fill="none"/>
    <g transform="translate(600 790) rotate(-32)">
      <rect x="-210" y="-10" width="420" height="20" rx="4" fill="url(#plateDarkB)"/>
      <circle cx="-210" cy="0" r="52" fill="url(#plateDarkB)"/>
      <circle cx="-210" cy="0" r="30" fill="url(#plateLightB)"/>
      <circle cx="210" cy="0" r="52" fill="url(#plateDarkB)"/>
      <circle cx="210" cy="0" r="30" fill="url(#plateLightB)"/>
    </g>
  </g>
</svg>
