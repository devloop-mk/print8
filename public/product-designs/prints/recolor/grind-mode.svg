<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" fill="none">
  <defs>
    <style>:root,svg{--ink-primary:#F4EDE4;--ink-secondary:#8B7355}</style>
    <filter id="badgeDistress" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="24" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#badgeDistress)">
    <circle cx="600" cy="720" r="290" stroke="var(--ink-secondary)" stroke-width="14" fill="none"/>
    <circle cx="600" cy="720" r="255" stroke="var(--ink-primary)" stroke-width="4" fill="none" stroke-opacity="0.55"/>
    <text x="600" y="620" text-anchor="middle" fill="var(--ink-primary)" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="78" font-weight="900" letter-spacing="6">GRIND</text>
    <text x="600" y="720" text-anchor="middle" fill="var(--ink-primary)" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="78" font-weight="900" letter-spacing="6">MODE</text>
    <g transform="translate(600 860) rotate(-20)">
      <rect x="-170" y="-8" width="340" height="16" rx="4" fill="var(--ink-secondary)"/>
      <circle cx="-170" cy="0" r="40" fill="var(--ink-primary)"/>
      <circle cx="-170" cy="0" r="22" fill="var(--ink-secondary)"/>
      <circle cx="170" cy="0" r="40" fill="var(--ink-primary)"/>
      <circle cx="170" cy="0" r="22" fill="var(--ink-secondary)"/>
    </g>
    <path d="M430 980 Q600 1040 770 980" stroke="var(--ink-secondary)" stroke-width="5" fill="none"/>
    <text x="600" y="1080" text-anchor="middle" fill="var(--ink-secondary)" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="10">NO DAYS OFF</text>
  </g>
</svg>
